name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK in the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Bloodlight.apk
          gh release delete latest --cleanup-tag -y -R "${{ github.repository }}" || true
          gh release create latest Bloodlight.apk -R "${{ github.repository }}" \
            --title "Bloodlight (último build)" --notes "APK mais recente, gerado a cada envio para a main."
